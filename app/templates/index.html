<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>청년주택 적격성 워크스페이스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <a href="#main" class="skip-link">본문 바로가기</a>

  <header class="top-nav" role="banner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">Y</span>
      <span>청년주택 적격성 워크스페이스</span>
    </div>
    <div class="context-pill">
      <span class="dot" aria-hidden="true"></span>
      <span id="context-pill-text">선택 공고: 미공개</span>
    </div>
    <div class="nav-actions">
      <button class="btn btn-secondary" style="height:auto;padding:8px 16px;font-size:14px;" id="profile-edit-btn">프로필 편집</button>
    </div>
  </header>

  <main id="main">
    <div class="workspace">

      <!-- Left: Conversation panel (~40%) -->
      <section class="conversation-panel" aria-label="대화">
        <div class="panel-header">
          <span>대화</span>
          <span style="color:var(--text-muted);font-weight:400;text-transform:none;letter-spacing:0;" id="message-count">0</span>
        </div>

        <div class="message-list" id="message-list" role="log" aria-label="대화 기록">
          <div class="message-list-empty" id="message-list-empty">
            <div class="message-list-empty-title">아직 대화가 없어요</div>
            <div class="message-list-empty-sub">
              공고를 선택하면 여기서 질문할 수 있어요.
              먼저 오른쪽에서 공고를 골라 주세요.
            </div>
          </div>
        </div>

        <div class="composer-wrap">
          <div class="composer" id="composer">
            <div class="composer-context" id="composer-context" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z" stroke="currentColor" stroke-width="2"/>
                <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span id="composer-context-text">공고</span>
            </div>
            <textarea class="composer-textarea" id="composer-text" placeholder="공고에 대해 질문하거나, 내 정보를 알려주세요…" rows="1" aria-label="채팅 메시지 입력" disabled></textarea>
            <div class="composer-actions">
              <button class="attach-btn" type="button" id="attach-btn" aria-label="공고 파일 첨부" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" stroke="currentColor" stroke-width="2"/>
                  <path d="M14 2v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </button>
              <button class="send-btn" type="button" id="send-btn" aria-label="메시지 전송" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M22 2l-7 20-4-4 2-8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="helper-text">Enter로 전송 · Shift+Enter로 줄 바꿈</div>
        </div>
      </section>

      <!-- Right: Information workspace (~60%) -->
      <section class="info-panel" aria-label="정보 워크스페이스">
        <div class="panel-header">
          <span>공고 목록</span>
          <span style="color:var(--text-muted);font-weight:400;text-transform:none;letter-spacing:0;" id="notice-count">0건</span>
        </div>

        <div class="panel-body">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-lg);">
            <h2 style="font-size:17px;font-weight:600;color:var(--text-primary);">내 조건에 맞는 공고</h2>
            <button class="btn btn-link" type="button" id="filter-reset-btn">필터 초기화</button>
          </div>

          <div class="recommendation-list" id="recommendation-list">
            <!-- 서버 렌더링 또는 JS 주입 -->
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Detail overlay -->
  <div class="detail-overlay" id="detail-overlay" hidden>
    <div class="detail" id="detail-content">
      <!-- 서버 또는 JS에서 채움 -->
    </div>
  </div>

  <script>
    (function() {
      const state = {
        userId: null,
        selectedNoticeId: null,
        messages: [],
        notices: [],
        isProcessing: false,
      };

      const $ = (sel) => document.querySelector(sel);
      const messageList = $('#message-list');
      const messageListEmpty = $('#message-list-empty');
      const recommendationList = $('#recommendation-list');
      const composerText = $('#composer-text');
      const sendBtn = $('#send-btn');
      const attachBtn = $('#attach-btn');
      const composerContext = $('#composer-context');
      const composerContextText = $('#composer-context-text');
      const contextPillText = $('#context-pill-text');
      const detailOverlay = $('#detail-overlay');
      const detailContent = $('#detail-content');
      const noticeCount = $('#notice-count');
      const messageCount = $('#message-count');

      function startProcessing() {
        state.isProcessing = true;
        sendBtn.disabled = true;
      }

      function stopProcessing() {
        state.isProcessing = false;
        sendBtn.disabled = !state.selectedNoticeId;
      }

      function setComposerEnabled(enabled) {
        composerText.disabled = !enabled;
        attachBtn.disabled = !enabled;
        sendBtn.disabled = !enabled || !state.selectedNoticeId;
        if (enabled && state.selectedNoticeId) {
          composerText.focus();
        }
      }

      function addMessage(role, body, meta, quickReplies) {
        state.messages.push({ role, body, meta, quickReplies, ts: new Date().toISOString() });
        renderMessages();
      }

      function renderMessages() {
        if (state.messages.length === 0) {
          messageListEmpty.hidden = false;
        } else {
          messageListEmpty.hidden = true;
        }

        Array.from(messageList.children).forEach(el => {
          if (el.id !== 'message-list-empty') el.remove();
        });

        state.messages.forEach((m) => {
          const div = document.createElement('div');
          div.className = 'message ' + m.role;

          const body = document.createElement('div');
          body.className = 'message-body';
          body.innerHTML = m.body;

          const meta = document.createElement('div');
          meta.className = 'message-meta';
          meta.textContent = m.meta || '';

          div.appendChild(body);
          div.appendChild(meta);

          if (m.quickReplies && m.quickReplies.length > 0) {
            const qr = document.createElement('div');
            qr.className = 'quick-replies';
            m.quickReplies.forEach(label => {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'quick-reply';
              btn.textContent = label;
              btn.addEventListener('click', () => handleQuickReply(label));
              qr.appendChild(btn);
            });
            div.appendChild(qr);
          }

          messageList.appendChild(div);
        });

        messageList.scrollTop = messageList.scrollHeight;
        messageCount.textContent = state.messages.length;
      }

      function handleQuickReply(label) {
        composerText.value = label;
        sendMessage();
      }

      function sendMessage() {
        const text = composerText.value.trim();
        if (!text || !state.selectedNoticeId || state.isProcessing) return;

        addMessage('user', text, formatTime(new Date()));
        composerText.value = '';
        startProcessing();

        setTimeout(() => {
          const reply = generateReply(text);
          addMessage('assistant', reply.body, formatTime(new Date()), reply.quickReplies);
          stopProcessing();
        }, 600);
      }

      function generateReply(userText) {
        const lower = userText.toLowerCase();
        if (lower.includes('신청') || lower.includes('가능성') || lower.includes('될까')) {
          return {
            body: '<strong>선택된 공고</strong>의 자격 조건을 확인했어요.<br/>아직 몇 가지 정보가 더 필요해요.',
            quickReplies: ['변동 없음', '아직 모름', '신청 계층 선택']
          };
        }
        if (lower.includes('소득') || lower.includes('월급') || lower.includes('연봉')) {
          return {
            body: '소득은 사용자가 직접 확인한 값을 기준으로 판정해요. 급여명세서나 홈택스 소득금액증명 등으로 확인한 월평균소득을 알려주시면, 공고 기준과 대조해 드릴게요.',
            quickReplies: ['소득 정보 제공하기', '확인 경로 자세히 보기', '아직 모름']
          };
        }
        if (lower.includes('무주택') || lower.includes('집')) {
          return {
            body: '무주택 여부는 세대 구성원 전원이 대상이에요. 현재 무주택 상태라면 "무주택이에요", 주택을 보유 중이면 "주택이 있어요"를 선택해 주세요.',
            quickReplies: ['무주택이에요', '주택이 있어요', '아직 모르겠어요']
          };
        }
        if (lower.includes('거주') || lower.includes('기간') || lower.includes('몇년')) {
          return {
            body: '해당 공고는 지역 거주기간을 조건으로 요구할 수 있어요. 현재 거주 지역과 거주 기간을 알려주시면 대조할 수 있어요.',
            quickReplies: ['거주 정보 제공하기', '거주기간 확인하기', '아직 모름']
          };
        }
        return {
          body: '질문을 이해가 어려웠어요. 공고를 선택하고 다시 질문해 주세요. "내가 신청할 수 있어?" 또는 "소득 기준이 뭔지 알려줘"처럼 물어보실 수 있어요.',
          quickReplies: ['공고 다시 선택하기', '도움말', '처음으로']
        };
      }

      function formatTime(d) {
        const h = d.getHours().toString().padStart(2, '0');
        const m = d.getMinutes().toString().padStart(2, '0');
        return `${h}:${m}`;
      }

      function selectNotice(notice) {
        state.selectedNoticeId = notice.id;
        composerContextText.textContent = notice.title;
        composerContext.hidden = false;
        contextPillText.textContent = '선택 공고: ' + notice.title;
        setComposerEnabled(true);

        document.querySelectorAll('.notice-card').forEach(card => {
          card.classList.toggle('selected', card.dataset.noticeId === notice.id);
          card.setAttribute('aria-selected', card.dataset.noticeId === notice.id ? 'true' : 'false');
        });

        if (state.messages.length === 0) {
          addMessage('assistant', `<strong>${notice.title}</strong>을(를) 확인했어요. 자격 조건을 한 항목씩 대조해 드릴게요. 궁금한 점을 물어봐 주세요.`, formatTime(new Date()), ['신청 가능성 확인', '자격 조건 보기', '소득 기준 질문']);
        }

        renderNotices();
      }

      function renderNotices() {
        const list = recommendationList;
        list.innerHTML = '';

        if (state.notices.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-title">아직 저장된 공고가 없어요</div>
              <div class="empty-state-sub">
                PDF, HWP, 텍스트 등 공고 자료를 업로드하거나 공고 목록에서 선택하면 여기에서 확인할 수 있어요.
              </div>
              <div class="empty-state-actions">
                <button class="btn btn-primary" type="button" id="upload-btn">공고 업로드</button>
                <button class="btn btn-secondary" type="button" id="list-btn">공고 목록 보기</button>
              </div>
            </div>
          `;
          noticeCount.textContent = '0건';
          return;
        }

        noticeCount.textContent = state.notices.length + '건';

        state.notices.forEach(notice => {
          const card = document.createElement('article');
          card.className = 'notice-card' + (notice.id === state.selectedNoticeId ? ' selected' : '');
          card.dataset.noticeId = notice.id;
          card.tabIndex = 0;
          card.setAttribute('aria-selected', notice.id === state.selectedNoticeId ? 'true' : 'false');

          card.innerHTML = `
            <div class="notice-card-top">
              <div class="badge badge-${notice.eligibility || 'unassessed'}">
                ${badgeSvg(notice.eligibility)}
                ${notice.eligibilityLabel || '평가 전'}
              </div>
              <div class="notice-card-main">
                <div class="notice-title">${escapeHtml(notice.title)}</div>
                <div class="notice-meta">
                  <span class="notice-meta-item"><strong>${escapeHtml(notice.agency || '기관 정보 없음')}</strong></span>
                  <span class="notice-meta-item">${escapeHtml(notice.noticeType || '')} · <strong>${escapeHtml(notice.region || '지역 정보 없음')}</strong></span>
                  <span class="notice-meta-item">공고일 ${escapeHtml(notice.publishDate || '미상')}</span>
                </div>
                <div class="badges">
                  <span class="period-status ${notice.isOpen ? 'open' : ''}">
                    ${notice.isOpen ? '접수 중 · 마감 ' + escapeHtml(notice.applyEnd) : '마감됨 · ' + escapeHtml(notice.applyEnd)}
                  </span>
                </div>
                <div class="requirement-counts">
                  <strong>${notice.counts?.met || 0}</strong> 충족 ·
                  <strong>${notice.counts?.needs_review || 0}</strong> 확인 필요 ·
                  <strong>${notice.counts?.not_met || 0}</strong> 미충족
                </div>
                ${notice.caution ? `<div class="caution">${escapeHtml(notice.caution)}</div>` : ''}
              </div>
            </div>
            <div class="notice-card-actions">
              <button class="btn btn-primary" type="button" data-action="detail">적격 상세 보기</button>
              <button class="btn btn-secondary" type="button" data-action="original">공고 원본 보기</button>
            </div>
          `;

          card.addEventListener('click', (e) => {
            if (e.target.closest('[data-action]')) {
              const action = e.target.closest('[data-action]').dataset.action;
              if (action === 'detail') {
                e.stopPropagation();
                showDetail(notice);
              }
              return;
            }
            selectNotice(notice);
          });

          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              selectNotice(notice);
            }
          });

          list.appendChild(card);
        });
      }

      function badgeSvg(type) {
        if (type === 'eligible') {
          return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        }
        if (type === 'needs_review') {
          return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2L2 22h20L12 2z" stroke="currentColor" stroke-width="2"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
        }
        if (type === 'ineligible') {
          return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 12 12)"/></svg>';
        }
        return '';
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      }

      function showDetail(notice) {
        const counts = notice.counts || { met: 0, needs_review: 0, not_met: 0 };
        detailContent.innerHTML = `
          <div class="detail-header">
            <div class="detail-header-top">
              <div>
                <div class="detail-title">${escapeHtml(notice.title)}</div>
                <div class="detail-meta">
                  ${escapeHtml(notice.agency || '')} · ${escapeHtml(notice.noticeType || '')} · ${escapeHtml(notice.region || '')} · 공고일 ${escapeHtml(notice.publishDate || '')}
                </div>
              </div>
              <button class="btn btn-secondary" style="height:auto;padding:8px 16px;font-size:14px;" type="button" id="detail-close">닫기</button>
            </div>
          </div>

          <div class="eligibility-summary">
            <div class="summary-header">
              <div class="summary-badge" aria-hidden="true">
                ${badgeSvg(notice.eligibility)}
              </div>
              <div class="summary-content">
                <div class="summary-label">${notice.eligibilityLabel || '평가 전'}</div>
                <div class="summary-reason">${escapeHtml(notice.summary || '판정이 완료되지 않았어요.')}</div>
                <div class="summary-counts">
                  <span class="summary-count" style="color:var(--eligible)">
                    ${badgeSvg('eligible')}
                    <strong>${counts.met}</strong> 충족
                  </span>
                  <span class="summary-count" style="color:var(--needs-review)">
                    ${badgeSvg('needs_review')}
                    <strong>${counts.needs_review}</strong> 확인 필요
                  </span>
                  <span class="summary-count" style="color:var(--ineligible)">
                    ${badgeSvg('ineligible')}
                    <strong>${counts.not_met}</strong> 미충족
                  </span>
                </div>
                <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">
                  판정 시점 ${escapeHtml(notice.judgedAt || '미정')} · 내 정보 마지막 확인 ${escapeHtml(notice.infoCheckedAt || '미정')}
                </div>
              </div>
            </div>
            <div class="summary-actions">
              <button class="btn btn-primary" type="button">누락 정보 제공하기</button>
              <button class="summary-secondary" type="button">확인 안내 자세히 보기</button>
            </div>
          </div>

          ${detailSections(notice)}
        `;

        detailOverlay.hidden = false;
        document.getElementById('detail-close').addEventListener('click', closeDetail);
      }

      function detailSections(notice) {
        if (!notice.details || notice.details.length === 0) {
          return `
            <div class="section">
              <div class="section-title">자격 조건 대조</div>
              <div class="evidence-card" style="color:var(--text-secondary);">
                아직 대조 결과가 없어요. 공고를 선택하고 판정이 완료되면 여기에 표시돼요.
              </div>
            </div>
          `;
        }

        let rows = '';
        notice.details.forEach(d => {
          const resultClass = d.result === 'met' ? 'met' : d.result === 'not_met' ? 'not-met' : d.result === 'needs_review' ? 'needs-review' : 'unverified';
          rows += `
            <tr>
              <td>
                <span class="requirement-kind">${d.requirementType === 'mandatory' ? '의무' : '우선'}</span>
                <div style="margin-top:4px;font-weight:600;">${escapeHtml(d.requirementName)}</div>
              </td>
              <td>${escapeHtml(d.noticeCriteria || '')}</td>
              <td>${escapeHtml(d.userInfo || '<span class="req-result unverified">확인되지 않음</span>')}</td>
              <td class="req-result ${resultClass}">${resultLabel(d.result)}</td>
            </tr>
          `;
        });

        return `
          <div class="section">
            <div class="section-title">자격 조건 대조</div>
            <table class="requirement-table">
              <thead>
                <tr>
                  <th style="width:22%;">조건</th>
                  <th style="width:30%;">공고 기준</th>
                  <th style="width:26%;">내 정보</th>
                  <th style="width:22%;">결과</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
              </tbody>
            </table>
          </div>
          <div class="section">
            <div class="final-review">
              <strong>시행기관 심사 안내</strong><br/>
              이 판정은 공고문 근거로 한 1차 확인이며, 최종 입주자격은 시행기관의 심사를 통해 결정됩니다.
              신청 전 공고 원본과 최신 정정공고를 다시 확인해 주세요.
            </div>
          </div>
        `;
      }

      function resultLabel(r) {
        return r === 'met' ? '충족' : r === 'not_met' ? '미충족' : r === 'needs_review' ? '확인 필요' : '확인되지 않음';
      }

      function closeDetail() {
        detailOverlay.hidden = true;
      }

      async function loadNotices() {
        try {
          const resp = await fetch('/api/notices');
          const data = await resp.json();
          state.notices = data.notices || [];
          renderNotices();

          if (state.notices.length > 0 && !state.selectedNoticeId) {
            selectNotice(state.notices[0]);
          }
        } catch (e) {
          console.error('notice load failed', e);
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      composerText.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      attachBtn.addEventListener('click', () => {
        alert('공고 파일 업로드 기능은 추후 API 연동 시 활성화돼요.');
      });

      document.getElementById('filter-reset-btn').addEventListener('click', () => {
        state.selectedNoticeId = null;
        composerContext.hidden = true;
        contextPillText.textContent = '선택 공고: 미공개';
        setComposerEnabled(false);
        renderNotices();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !detailOverlay.hidden) {
          closeDetail();
        }
      });

      (async () => {
        await loadNotices();
      })();
    })();
  </script>
</body>
</html>
